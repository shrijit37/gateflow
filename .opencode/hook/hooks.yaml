# Gateflow project hooks (consumed by the opencode-yaml-hooks plugin).
#
# `file.changed` fires after write/edit/multiedit/patch/apply_patch report
# file changes. These hooks re-run the compilers on the touched area so
# type/borrow errors surface in the agent transcript at edit time instead
# of waiting for a manual `cargo test` / `next build`.
#
# Notes:
# - hook failures here do NOT block the edit; output is logged and shown so
#   the agent can fix forward immediately.
# - bash actions run with cwd = project root ($OPENCODE_PROJECT_DIR).
# - to extend: add another `file.changed` entry with `matchesAnyPath` globs
#   (e.g. web/**/*.css -> `npm run --prefix web run lint`).

hooks:
  - event: file.changed
    conditions:
      - matchesAnyPath:
          - "crates/**/*.rs"
          - "Cargo.toml"
          - "Cargo.lock"
    actions:
      - bash:
          command: "cargo check --workspace --message-format=short 2>&1"
          timeout: 240000

  - event: file.changed
    conditions:
      - matchesAnyPath:
          - "web/**/*.ts"
          - "web/**/*.tsx"
    actions:
      - bash:
          command: "cd web && ./node_modules/.bin/tsc --noEmit 2>&1"
          timeout: 180000
