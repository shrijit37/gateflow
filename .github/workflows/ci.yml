name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard: agent session/state/config files must never be committed.
  # (Local agent setup lives in git-ignored files; see .gitignore.)
  lint-tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked agent artifacts and secrets
        run: |
          bad=$(git ls-files | grep -Ei '(\.opencode|opencode\.jsonc?|\.claude/|\.cursor/|\.codex/|\.aider|\.gemini/|\.continue/|session.*\.jsonl|transcript.*\.json|\.env$|\.env\.local|\.pem$|\.db$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Agent-related or secret files must not be committed:"; echo "$bad"; exit 1
          fi
          echo "tracked tree clean"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/eslint app lib components
      - run: npm run build
