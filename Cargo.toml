[workspace]
resolver = "3"
members = ["crates/engine", "crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/shrijit37/gateflow"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
gateflow-engine = { path = "crates/engine" }
gateflow-protocol = { path = "crates/protocol" }
http = "1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "stream", "json", "charset", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3